name: CI

on:
  push:
    branches:
      - main
      - bootstrap/job-runtime-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Job Packs
        run: npm run validate:jobs

      - name: Validate PowerShell runtime scripts syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw './openai-tunnel.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './start.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './gptworker-tray.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './reset-runtime.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './start-worker-background.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './wait-tray-ready.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './wait-runtime-ready.ps1')) | Out-Null

      - name: Setup preview accepts arbitrary credential text
        shell: pwsh
        run: |
          if (Test-Path ".env") { Remove-Item ".env" -Force }
          & ./openai-tunnel.ps1 -Init -WizardPreview -TunnelId "not-a-real-tunnel" -ApiKey "not-a-real-key" -NoBrowser
          if ($LASTEXITCODE -ne 0) {
            throw "WizardPreview rejected arbitrary UX-test input."
          }
          if (Test-Path ".env") {
            throw "WizardPreview must not create or modify .env."
          }

      - name: Full test suite
        run: npm test


  windows-worker-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate tunnel script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\openai-tunnel.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "openai-tunnel.ps1 is not compatible with Windows PowerShell 5.1 parser."
          }

      - name: Start detached Worker and verify health
        shell: pwsh
        run: |
          if (-not (Test-Path ".env")) { Copy-Item ".env.example" ".env" }
          & .\start.ps1 -Port 3000 -Detach
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 failed with exit code $LASTEXITCODE" }

          $deadline = (Get-Date).AddSeconds(20)
          $healthy = $false
          do {
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:3000/health" -TimeoutSec 2
              if ($health.status -eq "ok" -and $health.name -eq "chatgpt-local-worker") {
                $healthy = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)

          if (-not $healthy) {
            $logDir = Join-Path $env:LOCALAPPDATA "GPTWorker\logs"
            foreach ($name in @("worker.err.log", "worker.out.log")) {
              $file = Join-Path $logDir $name
              if (Test-Path $file) {
                Write-Host "--- $name ---"
                Get-Content $file -Tail 80
              }
            }
            throw "Detached Worker did not become healthy on Windows."
          }

          Write-Host "Windows detached Worker smoke test passed."

      - name: Stop smoke Worker
        if: always()
        shell: pwsh
        run: |
          $line = netstat -ano | Select-String ":3000\s" | Select-String "LISTENING" | Select-Object -First 1
          if ($line) {
            $parts = ($line -replace '\s+', ' ').ToString().Trim().Split(' ')
            $ownerPid = [int]$parts[-1]
            if ($ownerPid -gt 0) { Stop-Process -Id $ownerPid -Force -ErrorAction SilentlyContinue }
          }

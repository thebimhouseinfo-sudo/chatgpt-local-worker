name: CI

on:
  push:
    branches:
      - main
      - bootstrap/job-runtime-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Job Packs
        run: npm run validate:jobs

      - name: Validate PowerShell runtime scripts syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw './openai-tunnel.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './gptworker-tray.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './reset-runtime.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw './start-worker-background.ps1')) | Out-Null

      - name: Full test suite
        run: npm test

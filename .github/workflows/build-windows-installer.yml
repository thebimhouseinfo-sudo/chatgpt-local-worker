name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build, test, and package installer
        shell: powershell
        run: |
          .\scripts\build-release.ps1

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = "release\out\GPTWorker-Setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) {
            throw "Installer not found: $exe"
          }
          $item = Get-Item $exe
          Write-Host "Installer: $($item.FullName)"
          Write-Host "Size: $([math]::Round($item.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPTWorker-Setup-${{ steps.version.outputs.version }}
          path: release/out/GPTWorker-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GPTWorker v${{ steps.version.outputs.version }}
          files: release/out/GPTWorker-Setup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

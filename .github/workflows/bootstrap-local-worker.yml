name: Bootstrap Local Worker

on:
  push:
    branches:
      - bootstrap/job-runtime-v0.1
    paths:
      - .bootstrap-ready

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream Local Coder
        run: git clone --depth 1 https://github.com/hoangcoderr/chatgpt-local-coder.git "$RUNNER_TEMP/upstream"

      - name: Seed upstream snapshot
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/bootstrap-local-worker.yml' \
            --exclude='.bootstrap-ready' \
            "$RUNNER_TEMP/upstream/" ./
          rm -f .bootstrap-ready

      - name: Install dependencies
        run: npm install

      - name: Build upstream baseline
        run: npm run build

      - name: Run upstream tests
        run: npm test

      - name: Remove one-shot bootstrap workflow
        run: rm -f .github/workflows/bootstrap-local-worker.yml

      - name: Commit upstream baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: seed upstream local coder baseline"
          git push origin HEAD

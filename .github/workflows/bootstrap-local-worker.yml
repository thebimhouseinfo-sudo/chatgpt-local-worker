name: Bootstrap Local Worker

on:
  push:
    branches:
      - bootstrap/job-runtime-v0.1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream Local Coder
        run: |
          git clone --depth 1 https://github.com/hoangcoderr/chatgpt-local-coder.git "$RUNNER_TEMP/upstream"

      - name: Seed upstream and apply Local Worker overlay
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/bootstrap-local-worker.yml' \
            --exclude='.bootstrap-overlay/' \
            "$RUNNER_TEMP/upstream/" ./
          rsync -a .bootstrap-overlay/ ./
          rm -rf .bootstrap-overlay

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate Job Packs
        run: npm run validate:jobs

      - name: Run upstream tests
        run: npm test

      - name: Remove one-shot bootstrap workflow
        run: rm -f .github/workflows/bootstrap-local-worker.yml

      - name: Commit bootstrapped worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: bootstrap general local worker job runtime"
          git push origin HEAD

{
  "id": "dev-planing",
  "name": "Dev Planing",
  "version": "1.1.0",
  "status": "ready",
  "description": "Repository-aware development planning job that reviews code and produces a durable planning bundle: architecture, general implementation plan, TODO backlog, and executable task list without modifying source code.",
  "aliases": [
    "dev-planning",
    "plan",
    "dev-plan",
    "planning",
    "implementation-plan",
    "architecture-plan"
  ],
  "keywords": [
    "plan",
    "planing",
    "planning",
    "dev plan",
    "implementation plan",
    "architecture",
    "design",
    "scope",
    "impact",
    "migration plan",
    "technical plan",
    "todo",
    "task list"
  ],
  "inputs": [
    {
      "key": "workspace",
      "type": "repo",
      "required": true,
      "description": "Target local repository folder. This becomes the active workspace after confirmation."
    },
    {
      "key": "objective",
      "type": "string",
      "required": true,
      "description": "Feature, fix, migration, repository review, or engineering objective to plan"
    },
    {
      "key": "context",
      "type": "string",
      "required": false,
      "description": "Optional constraints, references, issue/PR context, or decisions already made"
    }
  ],
  "outputs": [
    {
      "key": "planning_dir",
      "type": "path",
      "required": false,
      "description": "Optional planning bundle directory. If omitted, Dev Planing resolves the repository's existing planning convention after confirmation; if none exists, it uses a suitable docs/plans location inside the confirmed workspace."
    }
  ],
  "permissions": {
    "filesystem": "read-project-write-planning-bundle-only-after-confirm",
    "shell": "read-only-inspection-after-confirm",
    "git": "read-only-after-confirm",
    "network": "only-when-required-for-reference-research-through-existing-tools"
  },
  "confirmation": {
    "required": true,
    "template": "JOB: planning\nFOLDER: {workspace}\n\nXác nhận bắt đầu?"
  },
  "skills": [
    "skills/repository-analysis.md",
    "skills/scope-and-constraints.md",
    "skills/architecture-impact.md",
    "skills/implementation-sequencing.md",
    "skills/validation-and-risk.md",
    "skills/handoff-artifacts.md"
  ],
  "harness": {
    "entrypoints": [
      "harness/validate.mjs",
      "harness/bundle-lint.mjs"
    ]
  },
  "validators": [
    "harness/validate.mjs",
    "harness/bundle-lint.mjs"
  ],
  "runtime": {
    "preload_families": [
      "filesystem",
      "shell",
      "git",
      "context",
      "mcp"
    ]
  }
}

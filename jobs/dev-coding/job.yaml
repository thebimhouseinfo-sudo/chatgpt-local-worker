{
  "id": "dev-coding",
  "name": "Dev Coding",
  "version": "1.4.2",
  "status": "ready",
  "description": "Professional code-execution job that reads the active planning bundle first, selects/updates executable tasks, plans execution, then performs targeted code changes using the GPTWorker execution core and its filesystem, shell, context, validation, and local execution capabilities.",
  "aliases": [
    "coding",
    "code",
    "dev-code",
    "dev",
    "software-development",
    "repo",
    "lisp",
    "debug",
    "refactor"
  ],
  "keywords": [
    "repo",
    "code",
    "coding",
    "dev coding",
    "lisp",
    "typescript",
    "javascript",
    "python",
    "git",
    "bug",
    "fix",
    "debug",
    "refactor",
    "test",
    "build",
    "frontend",
    "backend",
    "migration",
    "security",
    "performance"
  ],
  "inputs": [
    {
      "key": "workspace",
      "type": "repo",
      "required": true,
      "description": "Target local repository/source folder. This becomes the active workspace after confirmation."
    },
    {
      "key": "task",
      "type": "string",
      "required": true,
      "description": "Concrete engineering task or acceptance objective to execute"
    },
    {
      "key": "planning_dir",
      "type": "path",
      "required": false,
      "description": "Optional planning bundle directory containing ARCHITECTURE.md, IMPLEMENTATION_PLAN.md, TODO.md and TASKS.md"
    },
    {
      "key": "task_id",
      "type": "string",
      "required": false,
      "description": "Optional TASK-* identifier in TASKS.md to execute/update"
    },
    {
      "key": "plan",
      "type": "file",
      "required": false,
      "description": "Optional explicit implementation-plan path when not using the standard planning bundle"
    },
    {
      "key": "architecture",
      "type": "file",
      "required": false,
      "description": "Optional explicit architecture/design path when not using the standard planning bundle"
    }
  ],
  "outputs": [
    {
      "key": "delivery",
      "type": "string",
      "required": false,
      "description": "Optional delivery expectation such as working tree changes, patch, branch, commit, or PR"
    }
  ],
  "permissions": {
    "filesystem": "read-write-after-confirm",
    "shell": "allowed-after-confirm; Git CLI commands may be run through shell when Git is installed and required by the task",
    "network": "only-when-required-by-task-and-available-through-existing-tools"
  },
  "confirmation": {
    "required": true,
    "template": "JOB: coding\nFOLDER: {workspace}\n\nXác nhận bắt đầu?"
  },
  "skills": [
    "skills/repository-discovery.md",
    "skills/execution-planning.md",
    "skills/task-branch-planning.md",
    "skills/implementation.md",
    "skills/debugging.md",
    "skills/testing.md",
    "skills/validation.md",
    "skills/refactoring.md",
    "skills/dependencies-and-apis.md",
    "skills/security.md",
    "skills/performance.md",
    "skills/documentation-and-release.md",
    "skills/git-review.md"
  ],
  "harness": {
    "entrypoints": [
      "harness/planning-bundle-check.mjs",
      "harness/inspect-repo.mjs",
      "harness/execution-preflight.mjs",
      "harness/task-session.mjs",
      "harness/negative-control.mjs",
      "harness/task-plan-lint.mjs",
      "harness/quality-gate.mjs",
      "harness/diff-gate.mjs",
      "harness/change-audit.mjs",
      "harness/dependency-gate.mjs",
      "harness/completion-gate.mjs",
      "harness/validate.mjs"
    ]
  },
  "validators": [
    "harness/validate.mjs",
    "harness/completion-gate.mjs"
  ],
  "runtime": {
    "preload_families": [
      "filesystem",
      "shell",
      "context"
    ]
  }
}

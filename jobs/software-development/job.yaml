{
  "id": "software-development",
  "name": "Software Development",
  "version": "0.1.0",
  "description": "Inspect, modify, test, and validate a software repository using the existing filesystem/shell/git MCP core.",
  "aliases": ["code", "dev", "repo", "lisp", "software"],
  "keywords": ["repo", "code", "coding", "lisp", "typescript", "javascript", "python", "git", "bug", "fix", "refactor"],
  "inputs": [
    {
      "key": "workspace",
      "type": "repo",
      "required": true,
      "description": "Target repository or source folder"
    }
  ],
  "outputs": [
    {
      "key": "result",
      "type": "path",
      "required": true,
      "description": "Concrete output destination or working result location"
    }
  ],
  "permissions": {
    "filesystem": "read-write-after-confirm",
    "shell": "allowed-after-confirm",
    "git": "allowed-after-confirm"
  },
  "confirmation": {
    "required": true,
    "template": "Tôi sẽ sửa repo {workspace}, chạy kiểm tra cần thiết và ghi/giữ kết quả tại {result}. Xác nhận chứ?"
  },
  "harness": {
    "entrypoints": ["harness/validate.mjs"]
  },
  "validators": ["harness/validate.mjs"]
}

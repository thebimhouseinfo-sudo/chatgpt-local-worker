{
  "id": "layla",
  "name": "Layla",
  "version": "1.1.1",
  "status": "ready",
  "description": "Universal adaptive Job for ad-hoc work across text files, Office documents, spreadsheets, presentations, PDFs, file/folder organization, and mixed local file sets. Layla first locks the confirmed workspace, performs read-only discovery, proposes an execution plan for user approval, and only then performs mutations.",
  "aliases": [
    "assistant",
    "secretary",
    "thuky",
    "thu-ky",
    "office",
    "universal",
    "general"
  ],
  "keywords": [
    "file",
    "files",
    "folder",
    "document",
    "txt",
    "word",
    "docx",
    "excel",
    "xlsx",
    "spreadsheet",
    "powerpoint",
    "ppt",
    "pptx",
    "presentation",
    "office",
    "report",
    "organize",
    "rename",
    "convert",
    "merge",
    "extract",
    "summarize"
  ],
  "inputs": [
    {
      "key": "workspace",
      "type": "directory",
      "required": true,
      "description": "Absolute local folder containing the files to work with. This becomes the active workspace after confirmation."
    },
    {
      "key": "task",
      "type": "string",
      "required": true,
      "description": "The concrete outcome the user wants Layla to produce"
    }
  ],
  "outputs": [
    {
      "key": "delivery",
      "type": "string",
      "required": false,
      "description": "Optional requested output file, folder, naming convention, format, or delivery constraint"
    }
  ],
  "permissions": {
    "filesystem": "read-only-after-workspace-confirm-until-plan-confirmed-then-read-write-inside-confirmed-workspace",
    "shell": "read-only-inspection-after-workspace-confirm; mutating commands, including Git CLI commands when needed, allowed only after-plan-confirm",
    "network": "only-when-required-by-the-user-task-and-available-through-existing-tools"
  },
  "confirmation": {
    "required": true,
    "purpose": "workspace-gate",
    "template": "JOB: layla\nFOLDER: {workspace}\n\nXác nhận Workspace để Layla khảo sát và lập kế hoạch?"
  },
  "skills": [],
  "harness": {
    "entrypoints": [
      "harness/workspace-preflight.mjs",
      "harness/scope-gate.mjs",
      "harness/validate.mjs"
    ]
  },
  "validators": [
    "harness/validate.mjs"
  ],
  "plan_confirmation": {
    "required": true,
    "purpose": "execution-gate",
    "required_before": [
      "filesystem-write",
      "rename",
      "move",
      "delete",
      "mutating-shell",
      "output-generation"
    ],
    "template": "KẾ HOẠCH LAYLA:\n{plan}\n\nXác nhận thực hiện kế hoạch?"
  },
  "execution_policy": {
    "mode": "adaptive-two-gate",
    "read_only_discovery_before_plan": true,
    "user_plan_approval_before_mutation": true,
    "reconfirm_on_material_scope_change": true,
    "default_write_scope": "confirmed-workspace-only",
    "require_workspace_preflight": true
  },
  "runtime": {
    "preload_families": [
      "filesystem",
      "shell",
      "context"
    ]
  }
}

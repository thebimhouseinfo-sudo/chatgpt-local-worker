{
  "id": "technical-review",
  "name": "Technical Review",
  "version": "0.1.0",
  "description": "Review technical files against an explicit scope/criteria and produce a traceable review report.",
  "aliases": ["review", "audit", "technical-audit"],
  "keywords": ["review", "audit", "check", "technical review", "spec", "drawing", "document"],
  "inputs": [
    {
      "key": "source",
      "type": "path",
      "required": true,
      "description": "File/folder/repository to review"
    }
  ],
  "outputs": [
    {
      "key": "report",
      "type": "path",
      "required": true,
      "description": "Destination for the review report"
    }
  ],
  "permissions": {
    "filesystem": "read-mostly-after-confirm",
    "shell": "deterministic-validation-only-after-confirm",
    "git": "read-only-unless-job-scope-says-otherwise"
  },
  "confirmation": {
    "required": true,
    "template": "Tôi sẽ review nguồn {source} và ghi báo cáo vào {report}. Xác nhận chứ?"
  },
  "harness": {
    "entrypoints": ["harness/validate.mjs"]
  },
  "validators": ["harness/validate.mjs"]
}

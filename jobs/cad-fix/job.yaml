{
  "id": "cad-fix",
  "name": "CAD Fix",
  "version": "0.1.0",
  "description": "Apply controlled CAD/AutoLISP fixes using source files, deterministic checks, and explicit outputs.",
  "aliases": ["cad", "autocad", "cad-fix", "lisp-fix"],
  "keywords": ["cad", "autocad", "lisp", "dwg", "layer", "xref", "fix", "convert"],
  "inputs": [
    {
      "key": "source",
      "type": "path",
      "required": true,
      "description": "CAD/LISP source folder or target repository"
    }
  ],
  "outputs": [
    {
      "key": "result",
      "type": "path",
      "required": true,
      "description": "Destination for patched LISP/files or generated result"
    }
  ],
  "permissions": {
    "filesystem": "read-write-after-confirm",
    "shell": "allowed-after-confirm",
    "git": "allowed-if-source-is-repository"
  },
  "confirmation": {
    "required": true,
    "template": "Tôi sẽ xử lý CAD/LISP trong {source} và ghi kết quả vào {result}. Xác nhận chứ?"
  },
  "harness": {
    "entrypoints": ["harness/validate.mjs"]
  },
  "validators": ["harness/validate.mjs"]
}
